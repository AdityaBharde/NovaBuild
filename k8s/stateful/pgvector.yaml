apiVersion: v1
kind: Secret
metadata:
  name: pgvector-secret
  namespace: novabuild-core
type: Opaque
stringData:
  POSTGRES_DB: novabuild_db
  POSTGRES_USER: novabuild
  POSTGRES_PASSWORD: novabuild_password
---
apiVersion: v1
kind: Service
metadata:
  name: pgvector
  namespace: novabuild-core
  labels:
    app: pgvector
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: pgvector
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pgvector
  namespace: novabuild-core
  labels:
    app: pgvector
spec:
  serviceName: pgvector
  replicas: 1
  selector:
    matchLabels:
      app: pgvector
  template:
    metadata:
      labels:
        app: pgvector
    spec:
      containers:
        - name: pgvector
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: pgvector-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: pgvector-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgvector-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi