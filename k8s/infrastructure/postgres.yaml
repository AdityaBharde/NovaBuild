apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: novabuild
data:
  init.sql: |
    -- 1. Create all required microservice databases
    SELECT 'CREATE DATABASE novabuild_account_db'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'novabuild_account_db')\gexec
    
    SELECT 'CREATE DATABASE project_service'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'project_service')\gexec

    SELECT 'CREATE DATABASE novabuild_intelligent_db'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'novabuild_intelligent_db')\gexec

    -- 2. Connect to account service database and seed the plans
    \connect novabuild_account_db;

    CREATE TABLE IF NOT EXISTS plan (
                                        id BIGSERIAL PRIMARY KEY,
                                        name VARCHAR(255),
                                        stripe_price_id VARCHAR(255) UNIQUE,
                                        max_projects INTEGER,
                                        max_tokens_per_day INTEGER,
                                        max_previews INTEGER,
                                        unlimited_ai BOOLEAN,
                                        active BOOLEAN
    );

    INSERT INTO plan (id, name, stripe_price_id, max_projects, max_tokens_per_day, max_previews, unlimited_ai, active)
    VALUES
        (1, 'Pro Plan', 'price_1TxWRkRtRKfmvNxlPXtP7g4f', 10, 1000000, 3, true, true),
        (2, 'Business Plan', 'price_1TxWZDRtRKfmvNxlQYerhkN2', 50, 10000000, 10, true, true)
    ON CONFLICT (id) DO UPDATE SET
                                   name = EXCLUDED.name,
                                   stripe_price_id = EXCLUDED.stripe_price_id,
                                   max_projects = EXCLUDED.max_projects,
                                   max_tokens_per_day = EXCLUDED.max_tokens_per_day,
                                   max_previews = EXCLUDED.max_previews,
                                   unlimited_ai = EXCLUDED.unlimited_ai,
                                   active = EXCLUDED.active;

    SELECT setval('plan_id_seq', (SELECT COALESCE(MAX(id), 1) FROM plan));

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: novabuild
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: novabuild
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-scripts
          configMap:
            name: postgres-init-scripts

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: novabuild
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432