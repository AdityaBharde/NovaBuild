apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-service
  namespace: novabuild
  labels:
    app: project-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project-service
  template:
    metadata:
      labels:
        app: project-service
    spec:
      containers:
        - name: project-service
          image: asia-south2-docker.pkg.dev/protean-sunup-463913-t9/novabuild-repo/project-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-service:8888"
            - name: EUREKA_URI
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: EUREKA_URI
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: EUREKA_URI
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/project_service"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: DB_PASSWORD
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: DB_PASSWORD
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
              value: "org.hibernate.dialect.PostgreSQLDialect"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: MINIO_URL
              value: "http://minio:9000"
            - name: MINIO_PROJECT_BUCKET
              value: "projects"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: JWT_SECRET
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: JWT_SECRET_KEY
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: project-service
  namespace: novabuild
spec:
  selector:
    app: project-service
  ports:
    - port: 8082
      targetPort: 8082
