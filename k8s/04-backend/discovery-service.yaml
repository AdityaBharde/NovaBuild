apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: novabuild
  labels:
    app: discovery-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      containers:
        - name: discovery-service
          image: asia-south2-docker.pkg.dev/protean-sunup-463913-t9/novabuild-repo/discovery-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: SPRING_PROFILES_ACTIVE
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: novabuild
spec:
  selector:
    app: discovery-service
  ports:
    - port: 8761
      targetPort: 8761
