apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: novabuild
  labels:
    app: account-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - name: account-service
          image: asia-south2-docker.pkg.dev/protean-sunup-463913-t9/novabuild-repo/account-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: SERVER_PORT
              value: "8084"
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-service:8888"
            - name: EUREKA_URI
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: EUREKA_URI
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: EUREKA_URI
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/novabuild_account_db"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: DB_PASSWORD
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: DB_PASSWORD
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
              value: "org.hibernate.dialect.PostgreSQLDialect"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: JWT_SECRET
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: JWT_SECRET_KEY
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: STRIPE_API_KEY
            - name: Stripe_Webhook_Secret
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: STRIPE_WEBHOOK_SECRET
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: novabuild
spec:
  selector:
    app: account-service
  ports:
    - port: 8084
      targetPort: 8084
