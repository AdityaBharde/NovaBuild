apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligent-service
  namespace: novabuild
  labels:
    app: intelligent-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intelligent-service
  template:
    metadata:
      labels:
        app: intelligent-service
    spec:
      containers:
        - name: intelligent-service
          image: asia-south2-docker.pkg.dev/protean-sunup-463913-t9/novabuild-repo/intelligent-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-service:8888"
            - name: EUREKA_URI
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: EUREKA_URI
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: EUREKA_URI
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/novabuild_intelligent_db"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: DB_PASSWORD
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: DB_PASSWORD
            - name: AI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: AI_BASE_URL
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: AI_API_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: JWT_SECRET
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
              value: "org.hibernate.dialect.PostgreSQLDialect"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: JWT_SECRET_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1.5Gi"
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: intelligent-service
  namespace: novabuild
spec:
  selector:
    app: intelligent-service
  ports:
    - port: 8083
      targetPort: 8083
