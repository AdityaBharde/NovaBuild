apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  namespace: novabuild
  labels:
    app: config-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-service
  template:
    metadata:
      labels:
        app: config-service
    spec:
      containers:
        - name: config-service
          image: asia-south2-docker.pkg.dev/protean-sunup-463913-t9/novabuild-repo/config-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "native"
            - name: EUREKA_URI
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: EUREKA_URI
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: EUREKA_URI
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: config-service
  namespace: novabuild
spec:
  selector:
    app: config-service
  ports:
    - port: 8888
      targetPort: 8888
