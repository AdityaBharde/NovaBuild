apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: novabuild
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: asia-south2-docker.pkg.dev/protean-sunup-463913-t9/novabuild-repo/api-gateway:v1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: SPRING_PROFILES_ACTIVE
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: novabuild-config
                  key: EUREKA_URI
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: JWT_SECRET
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: JWT_SECRET_KEY
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: novabuild
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
