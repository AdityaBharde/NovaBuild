apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: core-isolation-policy
  namespace: novabuild-core
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # 1. Allow communication between all services and pods inside novabuild-core
    - from:
        - podSelector: {}

    # 2. Allow ingress traffic from the ingress controller to API gateway, frontend, and preview proxy
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080  # api-gateway
        - protocol: TCP
          port: 80    # frontend
        - protocol: TCP
          port: 3000  # preview-proxy