apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novabuild-ingress
  namespace: novabuild-core
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/websocket-services: "api-gateway,preview-proxy"
spec:
  ingressClassName: nginx
  rules:
    # 1. Main Application & API Gateway Routing
    - host: novabuild.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

    # 2. Dynamic Project Previews Routing (Wildcard)
    - host: "*.preview.novabuild.local"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: preview-proxy
                port:
                  number: 3000