apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-service-sa
  namespace: novabuild-core
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: novabuild-runner-manager
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
      - pods/status
      - services
      - endpoints
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: novabuild-runner-manager-binding
subjects:
  - kind: ServiceAccount
    name: workspace-service-sa
    namespace: novabuild-core
roleRef:
  kind: ClusterRole
  name: novabuild-runner-manager
  apiGroup: rbac.authorization.k8s.io