apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novabuild-ingress
  namespace: novabuild
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: novabuild.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
