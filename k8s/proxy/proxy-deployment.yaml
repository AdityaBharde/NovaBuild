apiVersion: v1
kind: Service
metadata:
  name: preview-proxy
  namespace: novabuild-core
  labels:
    app: preview-proxy
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: preview-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-proxy
  namespace: novabuild-core
  labels:
    app: preview-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: preview-proxy
  template:
    metadata:
      labels:
        app: preview-proxy
    spec:
      containers:
        - name: preview-proxy
          image: novabuild-preview-proxy:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: PREVIEW_NAMESPACE
              value: "novabuild-preview"
            - name: RUNNER_PORT
              value: "5173"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi