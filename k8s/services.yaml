# Account Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: novabuild
spec:
  replicas: 2
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - name: account-service
          image: novabuild/account-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: novabuild-configmap
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/novabuild_account_db"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgrespassword"
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: novabuild
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: account-service
---
