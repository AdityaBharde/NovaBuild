# Intelligent Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligent-service
  namespace: novabuild
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intelligent-service
  template:
    metadata:
      labels:
        app: intelligent-service
    spec:
      containers:
        - name: intelligent-service
          image: novabuild/intelligent-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: novabuild-configmap
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/novabuild_intelligent_db"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgrespassword"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: novabuild-secrets
                  key: OPENAI_API_KEY
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: intelligent-service
  namespace: novabuild
spec:
  ports:
    - port: 8083
      targetPort: 8083
  selector:
    app: intelligent-service
---
