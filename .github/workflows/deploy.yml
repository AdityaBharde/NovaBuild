name: NovaBuild Production CI/CD (GKE)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_service:
        description: 'Service to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frontend
          - api-gateway
          - intelligent-service
          - project-service
          - account-service
          - config-service
          - discovery-service
          - k8s-manifests-only

env:
  PROJECT_ID: protean-sunup-463913-t9
  GAR_LOCATION: asia-south2
  GKE_CLUSTER: novabuild
  GKE_ZONE: asia-south2
  NAMESPACE: novabuild
  REGISTRY: asia-south2-docker.pkg.dev/protean-sunup-463913-t9/novabuild-repo

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ==========================================
  # STAGE 1: Monorepo Change Detection
  # ==========================================
  filter:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      intelligent-service: ${{ steps.changes.outputs.intelligent-service }}
      project-service: ${{ steps.changes.outputs.project-service }}
      account-service: ${{ steps.changes.outputs.account-service }}
      config-service: ${{ steps.changes.outputs.config-service }}
      discovery-service: ${{ steps.changes.outputs.discovery-service }}
      k8s: ${{ steps.changes.outputs.k8s }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filtering
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
            api-gateway:
              - 'api-gateway/**'
              - 'common-lib/**'
              - 'pom.xml'
            intelligent-service:
              - 'intelligent-service/**'
              - 'common-lib/**'
              - 'pom.xml'
            project-service:
              - 'project-service/**'
              - 'common-lib/**'
              - 'pom.xml'
            account-service:
              - 'account-service/**'
              - 'common-lib/**'
              - 'pom.xml'
            config-service:
              - 'config-service/**'
              - 'pom.xml'
            discovery-service:
              - 'discovery-service/**'
              - 'pom.xml'
            k8s:
              - 'k8s/**'

  # ==========================================
  # STAGE 2: Build & Push Java Microservices
  # ==========================================
  build-and-push-backend:
    name: Build & Push Backend Services
    needs: filter
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: discovery-service
            port: 8761
            flag: discovery-service
          - service: config-service
            port: 8888
            flag: config-service
          - service: api-gateway
            port: 8080
            flag: api-gateway
          - service: account-service
            port: 8084
            flag: account-service
          - service: project-service
            port: 8082
            flag: project-service
          - service: intelligent-service
            port: 8083
            flag: intelligent-service
    if: >
      github.event_name == 'push' && (
        needs.filter.outputs[matrix.flag] == 'true' ||
        needs.filter.outputs.common == 'true'
      ) ||
      github.event_name == 'workflow_dispatch' && (
        github.event.inputs.target_service == 'all' ||
        github.event.inputs.target_service == matrix.service
      )

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR with Maven (${{ matrix.service }})
        run: |
          mvn clean package -pl ${{ matrix.service }} -am -DskipTests --batch-mode

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # STAGE 3: Build & Push Frontend
  # ==========================================
  build-and-push-frontend:
    name: Build & Push Frontend
    needs: filter
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' && needs.filter.outputs.frontend == 'true' ||
      github.event_name == 'workflow_dispatch' && (
        github.event.inputs.target_service == 'all' ||
        github.event.inputs.target_service == 'frontend'
      )

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # STAGE 4: Continuous Deployment to GKE
  # ==========================================
  deploy-to-gke:
    name: Deploy & Rollout to GKE
    needs:
      - filter
      - build-and-push-backend
      - build-and-push-frontend
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK & GKE Auth Plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Connect to GKE Cluster
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --region ${{ env.GKE_ZONE }} \
            --project ${{ env.PROJECT_ID }}

      - name: Apply Infrastructure & Ingress Manifests
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-configmap.yaml
          kubectl apply -f k8s/infrastructure/
          kubectl apply -f k8s/06-ingress/ingress.yaml

      - name: Rolling Update - Backend Deployments
        run: |
          SERVICES=("discovery-service" "config-service" "api-gateway" "account-service" "project-service" "intelligent-service")
          for svc in "${SERVICES[@]}"; do
            echo "Checking deployment status for $svc..."
            kubectl set image deployment/$svc $svc=${{ env.REGISTRY }}/$svc:${{ github.sha }} -n ${{ env.NAMESPACE }} || true
          done

      - name: Rolling Update - Frontend Deployment
        run: |
          kubectl set image deployment/frontend frontend=${{ env.REGISTRY }}/frontend:${{ github.sha }} -n ${{ env.NAMESPACE }} || true

      - name: Verify Rollout Health
        run: |
          DEPLOYMENTS=("discovery-service" "config-service" "api-gateway" "account-service" "project-service" "intelligent-service" "frontend")
          for dep in "${DEPLOYMENTS[@]}"; do
            echo "Verifying rollout for $dep..."
            if ! kubectl rollout status deployment/$dep -n ${{ env.NAMESPACE }} --timeout=180s; then
              echo "::error::Rollout failed for $dep! Initiating automatic rollback..."
              kubectl rollout undo deployment/$dep -n ${{ env.NAMESPACE }}
              exit 1
            fi
          done

      - name: Post-Deployment Cluster State
        if: always()
        run: |
          echo "=== Active Pods in Namespace ${{ env.NAMESPACE }} ==="
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide
          echo "=== Public Endpoints ==="
          kubectl get svc -n ${{ env.NAMESPACE }}
          kubectl get ingress -n ${{ env.NAMESPACE }}
