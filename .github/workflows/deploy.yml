
name: NovaBuild CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novabuild-production
  cancel-in-progress: false

jobs:
  ci:
    name: Build and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Maven modules
        run: mvn -B -DskipTests package

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to Azure VM
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
          AZURE_SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$AZURE_SSH_KEY" > ~/.ssh/azure_key
          chmod 600 ~/.ssh/azure_key

          ssh-keyscan -H "$AZURE_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/azure_key \
            -o IdentitiesOnly=yes \
            "$AZURE_USER@$AZURE_HOST" 'bash -se' <<'REMOTE'
          set -eu

          cd ~/NovaBuild
          git pull --ff-only origin main

          mvn -B -DskipTests package

          docker build -t novabuild-discovery-service:latest ./discovery-service
          docker build -t novabuild-config-service:latest ./config-service
          docker build -t novabuild-account-service:latest ./account-service
          docker build -t novabuild-project-service:latest ./project-service
          docker build -t novabuild-intelligent-service:latest ./intelligent-service
          docker build -t novabuild-api-gateway:latest ./api-gateway

          docker compose build frontend

          docker compose up -d --no-deps --force-recreate discovery-service config-service

          docker compose up -d --no-deps --force-recreate \
            account-service project-service intelligent-service api-gateway frontend

          docker compose ps
          REMOTE

          rm -f ~/.ssh/azure_key
