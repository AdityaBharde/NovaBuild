spring:
  application:
    name: account-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

jwt:
  secret-key: ${JWT_SECRET}

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
