spring.application.name=NovaBuild
spring.datasource.url=jdbc:postgresql://localhost:5432/NovaBuild
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=${JWT_SECRET}
stripe.secret=${STRIPE_API_KEY}
stripe.webhook.secret=${Stripe_Webhook_Secret}
client.url=http://localhost:8080/
# AI Configuration
spring.ai.openai.base-url=${AI_BASE_URL:https://openrouter.ai/api}
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.chat.model=openai/gpt-5.2-codex
spring.ai.openai.chat.temperature=0.0
# MinIO Configuration
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=novabuild-files