server:
  port: 8081

spring:
  application:
    name: account-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/novabuild_account_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://openrouter.ai/api}
      api-key: ${AI_API_KEY:}


eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

jwt:
  secret-key: ${JWT_SECRET:novabuild-lovable-clone-super-secret-key-2026-production-32bytes}

stripe:
  api:
    secret: ${STRIPE_API_KEY:default_stripe_key}
  webhook:
    secret: ${Stripe_Webhook_Secret:default_webhook_secret}

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000/}