server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: account-service-public
          uri: lb://account-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/billing/webhook

        - id: account-service-protected
          uri: lb://account-service
          predicates:
            - Path=/api/v1/users/**, /api/v1/billing/**

        - id: project-service
          uri: lb://project-service
          predicates:
            - Path=/api/v1/projects/**, /api/v1/files/**, /api/v1/members/**

        - id: intelligent-service
          uri: lb://intelligent-service
          predicates:
            - Path=/api/v1/chats/**
          metadata:
            response-timeout: 300000
            connect-timeout: 10000

        - id: sandbox-service
          uri: lb://sandbox-service
          predicates:
            - Path=/api/v1/sandbox/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# ──────── ADDED SECTIONS ────────

jwt:
  secretKey: ${JWT_SECRET:novabuild-lovable-clone-super-secret-key-2026-production-32bytes}

app:
  security:
    public-routes:
      - /api/v1/auth/**
      - /api/v1/billing/webhook
      - /actuator/**