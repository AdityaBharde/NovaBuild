server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        # Public authentication and webhook endpoints
        - id: account-service-auth-v1
          uri: lb://account-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=2

        - id: account-service-auth-compat
          uri: lb://account-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: account-service-webhooks-v1
          uri: lb://account-service
          predicates:
            - Path=/api/v1/webhooks/**,/api/v1/billing/webhook
          filters:
            - StripPrefix=2

        - id: account-service-webhooks-compat
          uri: lb://account-service
          predicates:
            - Path=/api/webhooks/**,/api/billing/webhook
          filters:
            - StripPrefix=1

        # Protected account and billing endpoints
        - id: account-service-protected-v1
          uri: lb://account-service
          predicates:
            - Path=/api/v1/users/**,/api/v1/billing/**
          filters:
            - StripPrefix=2

        - id: account-service-protected-compat
          uri: lb://account-service
          predicates:
            - Path=/api/users/**,/api/billing/**
          filters:
            - StripPrefix=1

        # Project service
        - id: project-service-v1
          uri: lb://project-service
          predicates:
            - Path=/api/v1/projects/**,/api/v1/files/**,/api/v1/members/**
          filters:
            - StripPrefix=2

        - id: project-service-compat
          uri: lb://project-service
          predicates:
            - Path=/api/projects/**,/api/files/**,/api/members/**
          filters:
            - StripPrefix=1

        # Intelligent service
        - id: intelligent-service-v1
          uri: lb://intelligent-service
          predicates:
            - Path=/api/v1/chat/**,/api/v1/chats/**
          filters:
            - StripPrefix=2
          metadata:
            response-timeout: 300000
            connect-timeout: 10000

        - id: intelligent-service-compat
          uri: lb://intelligent-service
          predicates:
            - Path=/api/chat/**,/api/chats/**
          filters:
            - StripPrefix=1
          metadata:
            response-timeout: 300000
            connect-timeout: 10000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

jwt:
  secretKey: ${JWT_SECRET}

app:
  security:
    public-routes:
      - /api/v1/auth/**
      - /api/auth/**
      - /api/v1/webhooks/**
      - /api/webhooks/**
      - /api/v1/billing/webhook
      - /api/billing/webhook
      - /actuator/**