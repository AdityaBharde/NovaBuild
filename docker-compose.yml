version: '3.8'

services:
  # Frontend Application (Lovable UI Clone)
  frontend:
    build:
      context: ./frontend
    container_name: novabuild-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - novabuild-network

  # Infrastructure Services
  postgres:
    image: postgres:16-alpine
    container_name: novabuild-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_MULTIPLE_DATABASES: novabuild_account_db,novabuild_project_db,novabuild_intelligent_db,novabuild_sandbox_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - novabuild-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: novabuild-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - novabuild-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: novabuild-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - novabuild-network

  # Core Microservices
  discovery-service:
    build:
      context: ./discovery-service
    container_name: novabuild-discovery
    ports:
      - "8761:8761"
    networks:
      - novabuild-network

  config-service:
    build:
      context: ./config-service
    container_name: novabuild-config
    ports:
      - "8888:8888"
    environment:
      EUREKA_URI: http://discovery-service:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      - discovery-service
    networks:
      - novabuild-network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: novabuild-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
      EUREKA_URI: http://discovery-service:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: novabuild-lovable-clone-super-secret-key-2026-production-32bytes
      ACCOUNT_SERVICE_URL: http://account-service:8081
      PROJECT_SERVICE_URL: http://project-service:8082
      INTELLIGENT_SERVICE_URL: http://intelligent-service:8083
      SANDBOX_SERVICE_URL: http://sandbox-service:8085
    depends_on:
      - discovery-service
      - config-service
      - account-service
    networks:
      - novabuild-network

  account-service:
    build:
      context: ./account-service
    container_name: novabuild-account
    ports:
      - "8081:8081"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
      EUREKA_URI: http://discovery-service:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/novabuild_account_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      JWT_SECRET: novabuild-lovable-clone-super-secret-key-2026-production-32bytes
    depends_on:
      - postgres
      - discovery-service
    networks:
      - novabuild-network

  project-service:
    build:
      context: ./project-service
    container_name: novabuild-project
    ports:
      - "8082:8082"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
      EUREKA_URI: http://discovery-service:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/novabuild_project_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - postgres
      - kafka
      - discovery-service
    networks:
      - novabuild-network

  intelligent-service:
    build:
      context: ./intelligent-service
    container_name: novabuild-intelligent
    ports:
      - "8083:8083"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
      EUREKA_URI: http://discovery-service:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/novabuild_intelligent_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AI_API_KEY: ${OPENAI_API_KEY:-demo-key}
    depends_on:
      - postgres
      - kafka
      - discovery-service
    networks:
      - novabuild-network

  sandbox-service:
    build:
      context: ./sandbox-service
    container_name: novabuild-sandbox
    ports:
      - "8085:8085"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
      EUREKA_URI: http://discovery-service:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/novabuild_sandbox_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - postgres
      - kafka
      - discovery-service
    networks:
      - novabuild-network

volumes:
  postgres_data:

networks:
  novabuild-network:
    driver: bridge
